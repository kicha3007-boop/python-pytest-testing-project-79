[project]
name = "hexlet-code"
version = "0.1.0"
description = "Page loader: downloads a web page with its local resources"
authors = [{ name = "Kichigin Sergey" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.32",
]

[project.scripts]
page-loader = "page_loader.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "requests-mock>=1.12.1",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["page_loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 95
